name: Antigravity Daily Job Sweep

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # 14:00 UTC is 8:00 AM MT (Mountain Time)
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install anthropic reportlab markdown beautifulsoup4 pymupdf python-docx requests lxml

      - name: Run Antigravity Worker (scan + customize)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python github_daily_worker.py

      - name: Run Application Engine (generate + submit)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # LinkedIn Easy Apply — add these in repo Settings > Secrets
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: |
          python3 scripts/apply_jobs.py --limit 5

      - name: Commit application log back to repo
        run: |
          git config user.name "Antigravity Bot"
          git config user.email "bot@antigravity"
          git add data/applications.json APPLICATIONS.md scanner_state.json || true
          git diff --cached --quiet || git commit -m "chore: daily sweep $(date +%Y-%m-%d)"
          git push || true

      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: 🚀 Antigravity Job Sweep Results
          to: ryanwinzenburg@gmail.com
          from: Antigravity Subagent
          html_body: file://email_report.html
          attachments: customized_applications/**/*.pdf
          ignore_cert: true
