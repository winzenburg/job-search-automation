name: Daily Job Sweep

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # 14:00 UTC is 8:00 AM MT (Mountain Time)
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install \
            anthropic reportlab markdown beautifulsoup4 pymupdf python-docx \
            requests lxml playwright

      - name: Install Playwright browser (Chromium)
        run: playwright install chromium --with-deps

      - name: Run Antigravity Worker (scan + discover)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python github_daily_worker.py

      - name: Generate application materials (AI resume + cover letter)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPLICANT_NAME: ${{ secrets.APPLICANT_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
          APPLICANT_LINKEDIN: ${{ secrets.APPLICANT_LINKEDIN }}
          APPLICANT_LOCATION: ${{ secrets.APPLICANT_LOCATION }}
          APPLICANT_WEBSITE: ${{ secrets.APPLICANT_WEBSITE }}
          APPLICANT_SALARY: ${{ secrets.APPLICANT_SALARY }}
        run: |
          python3 scripts/apply_jobs.py --limit 5 --no-submit

      - name: Auto-submit applications (LinkedIn, Greenhouse, Lever, Ashby, Indeed)
        env:
          # LinkedIn Easy Apply
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          # Applicant profile for ATS form-fill
          APPLICANT_NAME: ${{ secrets.APPLICANT_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
          APPLICANT_LINKEDIN: ${{ secrets.APPLICANT_LINKEDIN }}
          APPLICANT_LOCATION: ${{ secrets.APPLICANT_LOCATION }}
          APPLICANT_WEBSITE: ${{ secrets.APPLICANT_WEBSITE }}
          APPLICANT_SALARY: ${{ secrets.APPLICANT_SALARY }}
          # Indeed (optional — only needed for Indeed Quick Apply)
          INDEED_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          INDEED_PASSWORD: ${{ secrets.INDEED_PASSWORD }}
        run: |
          python3 scripts/auto_apply.py --batch --limit 5

      - name: Commit application logs back to repo
        run: |
          git config user.name "Antigravity Bot"
          git config user.email "bot@antigravity"
          git add \
            data/applications.json \
            data/.submit_rate.json \
            APPLICATIONS.md \
            scanner_state.json || true
          git diff --cached --quiet || git commit -m "chore: daily sweep $(date +%Y-%m-%d)"
          git push || true

      - name: Build daily report (email + Telegram)
        id: report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/build_report.py
          echo "today=$(date +%B\ %-d)" >> "$GITHUB_OUTPUT"

      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Job search update — ${{ steps.report.outputs.today }}"
          to: ryanwinzenburg@gmail.com
          from: Antigravity Bot
          html_body: file://email_report.html
          attachments: customized_applications/**/*.pdf
          ignore_cert: true
